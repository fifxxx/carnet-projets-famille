[build]
  publish = "."

# Filet de sécurité : les téléphones ont pu mémoriser une ancienne version du
# manifeste qui cherchait les icônes dans "icons". On les renvoie vers "icones"
# pour que l'icône s'affiche sans attendre le renouvellement de leur cache.
[[redirects]]
  from = "/icons/*"
  to = "/icones/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le service worker et la page ne doivent jamais être figés dans le cache du
# navigateur, sinon une nouvelle version mise en ligne ne serait jamais vue.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les icônes, elles, peuvent être gardées longtemps
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
