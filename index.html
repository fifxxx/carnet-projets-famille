<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le carnet de projets</title>

<!-- Installation sur l'écran d'accueil du téléphone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2E45">
<meta name="description" content="Réserves, projets, courses et idées de la famille, au même endroit.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2E45; --ink-soft:#3C4E6B;
    --paper:#FBF3E4; --paper-dim:#F3E9D6;
    --surface:#FFFFFF;
    --cover:#1F2E45;
    --ochre:#C98A2C; --ochre-dim:#E8C98C;
    --teal:#3F7A6C; --teal-dim:#CFE3DD; --teal-wash:#EEF6F2;
    --danger:#B3413A;
    --line: rgba(31,46,69,0.14);
    --gauge-start:#4C86D9; --gauge-end:#3F9E6C;
    --pill-bg: rgba(255,255,255,0.88);
    --tab-bg:#3C4E6B; --tab-bg-hover:#4A5D80; --tab-fg:rgba(251,243,228,0.75);
    --on-cover:#FBF3E4; --on-cover-soft:rgba(251,243,228,0.58);
    --on-cover-faint:rgba(251,243,228,0.4); --on-cover-line:rgba(251,243,228,0.25);
    --rule: rgba(31,46,69,0.055);
    --card-shadow: rgba(0,0,0,0.10);
  }

  /* Mode sombre : appliqué au choix de l'utilisateur, ou en suivant le réglage
     du téléphone quand aucun choix n'a été fait. */
  :root[data-theme="dark"],
  :root[data-theme="auto"] { color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root[data-theme="auto"]{ color-scheme: light; }
  }
  :root[data-theme="dark"]{
    --ink:#E9EEF6; --ink-soft:#A7B7CD;
    --paper:#1A2333; --paper-dim:#222D40;
    --surface:#212C3E;
    --cover:#0E1521;
    --ochre:#D9A241; --ochre-dim:#6B5324;
    --teal:#4E9A86; --teal-dim:#27463E; --teal-wash:#18302A;
    --danger:#D2645C;
    --line: rgba(233,238,246,0.16);
    --pill-bg: rgba(20,28,42,0.85);
    --tab-bg:#26334A; --tab-bg-hover:#33435F; --tab-fg:rgba(233,238,246,0.7);
    --on-cover:#E9EEF6; --on-cover-soft:rgba(233,238,246,0.55);
    --on-cover-faint:rgba(233,238,246,0.35); --on-cover-line:rgba(233,238,246,0.22);
    --rule: rgba(233,238,246,0.05);
    --card-shadow: rgba(0,0,0,0.45);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      --ink:#E9EEF6; --ink-soft:#A7B7CD;
      --paper:#1A2333; --paper-dim:#222D40;
      --surface:#212C3E;
      --cover:#0E1521;
      --ochre:#D9A241; --ochre-dim:#6B5324;
      --teal:#4E9A86; --teal-dim:#27463E; --teal-wash:#18302A;
      --danger:#D2645C;
      --line: rgba(233,238,246,0.16);
      --pill-bg: rgba(20,28,42,0.85);
      --tab-bg:#26334A; --tab-bg-hover:#33435F; --tab-fg:rgba(233,238,246,0.7);
      --on-cover:#E9EEF6; --on-cover-soft:rgba(233,238,246,0.55);
      --on-cover-faint:rgba(233,238,246,0.35); --on-cover-line:rgba(233,238,246,0.22);
      --rule: rgba(233,238,246,0.05);
      --card-shadow: rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--cover);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.03), transparent 40%);
    font-family:'IBM Plex Sans', sans-serif; color:var(--ink);
    min-height:100vh;
    /* Marges adaptées à l'encoche et à la barre d'accueil une fois installée */
    padding:
      calc(18px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
      calc(60px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  button, .chip, .tab{ -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:2.5px solid var(--ochre); outline-offset:2px; border-radius:4px; }
  .app-logo{ width:30px; height:30px; flex-shrink:0; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .wrap{max-width:600px;margin:0 auto;}
  .titlebar{ padding:4px 8px 6px; color:var(--on-cover); }
  .titlebar-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .titlebar h1{ font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:26px; margin:0; }
  .titlebar span{ font-size:12.5px; color:var(--on-cover-soft); }
  .tagline{ font-family:'Fraunces', serif; font-style:italic; font-size:12.5px; color:var(--on-cover-soft); margin:2px 0 8px 1px; }

  .summary{ position:sticky; top:10px; z-index:20; display:flex; gap:10px; margin-bottom:14px; }
  .stat{ flex:1; background:var(--paper); border:1.5px solid var(--ink); border-radius:10px; padding:10px 14px; box-shadow:3px 3px 0 rgba(0,0,0,0.18); }
  .stat .label{ font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; }
  .stat .label svg{width:13px; height:13px;}
  .stat .value{ font-family:'Fraunces', serif; font-weight:600; font-size:21px; font-variant-numeric: tabular-nums; }
  .stat.free .value{color:var(--teal);}
  .stat.safe .value{color:var(--ink-soft);}
  .stat.free.negative .value{color:var(--danger);}

  .tabs{
    display:flex; gap:6px; padding:0 4px 2px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:13px; white-space:nowrap; flex-shrink:0;
    background:var(--tab-bg); color:var(--tab-fg); border:none;
    padding:10px 14px 12px; border-radius:10px 10px 0 0; cursor:pointer;
    position:relative; top:2px; transition:transform .12s ease, background .15s ease, color .15s ease;
  }
  .tab.active{ background:var(--paper); color:var(--ink); top:0; }
  .tab:not(.active):hover{ background:var(--tab-bg-hover); color:var(--on-cover); }
  .tab:active{ transform:scale(.96); }
  @keyframes underlineGrow{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
  .tab.active::after{
    content:''; position:absolute; left:12px; right:12px; bottom:0; height:3px;
    border-radius:3px; background:var(--tab-accent, var(--ochre)); transform-origin:left; animation:underlineGrow .3s ease;
  }

  .page{
    background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 26px, var(--rule) 27px);
    border-radius:0 10px 10px 10px; border:1.5px solid var(--ink);
    padding:20px 16px 24px; min-height:320px; overflow:hidden;
  }
  @keyframes panelIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .panel-anim{ animation: panelIn .32s ease; }

  h2.section-title{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin:0 0 4px; }
  .subtext{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}

  label{font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:4px;}
  input[type=text], input[type=number], input[type=date], input[type=url], textarea, select{
    font-family:'IBM Plex Sans', sans-serif; font-size:14.5px; padding:8px 10px;
    border:1.5px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); width:100%;
  }
  textarea{ resize:vertical; min-height:56px; font-family:'IBM Plex Sans', sans-serif; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--ochre); outline-offset:1px; }

  .field{margin-bottom:14px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}

  .bar-outer{ height:34px; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; display:flex; margin:14px 0 8px; background:var(--surface); }
  .bar-seg{height:100%; transition:width .3s ease;}
  .bar-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; margin-bottom:20px;}
  .bar-legend .dot{width:9px;height:9px;border-radius:2px; display:inline-block; margin-right:5px;}
  .warn{ background:var(--danger); color:#fff; font-size:12.5px; padding:8px 10px; border-radius:7px; margin-bottom:16px; }

  button{ transition: transform .12s ease; font-family:'IBM Plex Sans', sans-serif; }
  button.primary{
    font-weight:600; font-size:13.5px; background:var(--ink); color:var(--surface); border:none;
    padding:10px 16px; border-radius:8px; cursor:pointer;
  }
  button.primary:hover{background:var(--ink-soft);}
  button.primary:active{ transform:scale(.95); }

  .chip-row{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:2px;}
  .chip{
    font-size:12.5px; font-weight:500; padding:6px 12px; border-radius:20px;
    border:1.5px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink-soft);
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
    display:inline-flex; align-items:center;
  }
  .chip svg{width:12px;height:12px;margin-right:4px;}
  .chip.selected{ border-color:var(--ink); color:var(--ink); background:var(--paper-dim); }
  .chip:active{ transform:scale(.94); }

  .add-toggle{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .add-form{ background:var(--paper-dim); border:1.5px dashed var(--line); border-radius:10px; padding:14px; margin-bottom:18px; }

  .prio-section{ margin-bottom:22px; }
  .prio-header{ display:flex; align-items:center; justify-content:space-between; padding:7px 12px; border-radius:8px; margin-bottom:10px; }
  .prio-header .prio-name{ font-family:'Fraunces', serif; font-weight:600; font-size:14.5px; }
  .prio-header .prio-count{ font-size:11.5px; opacity:0.85; }

  /* Project cards */
  .card{
    background:var(--surface); border:1.5px solid var(--ink); border-radius:10px;
    padding:9px 10px 9px 12px; margin-bottom:9px; position:relative; border-left-width:6px;
    transition: background-color .35s ease, border-color .35s ease, box-shadow .2s ease, transform .2s ease;
  }
  .card.funded{ background:var(--teal-wash); border-color:var(--teal); }
  @media (hover:hover){ .card:hover{ box-shadow:4px 4px 0 var(--card-shadow); transform:translateY(-1px); } }
  .card-top{display:flex; gap:9px; align-items:flex-start;}
  .card-icon-btn{
    width:46px; height:46px; border-radius:50%; background:var(--paper-dim); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; padding:0; cursor:pointer;
    transition: transform .12s ease, box-shadow .15s ease;
  }
  .card-icon-btn:hover{ box-shadow:0 0 0 3px var(--paper-dim); }
  .card-icon-btn:active{ transform:scale(.92); }
  .card.funded .card-icon-btn{ background:var(--teal-dim); border-color:var(--teal); animation: iconBounce 2.4s ease-in-out infinite; }
  @keyframes iconBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  .card-title-block{flex:1; min-width:0;}
  .card-name-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .card-name{font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; line-height:1.25;}
  @keyframes badgePulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(63,122,108,0.4); } 50%{ box-shadow:0 0 0 5px rgba(63,122,108,0); } }
  .funded-badge{
    display:inline-flex; align-items:center; gap:4px; background:var(--teal); color:#fff;
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px; animation: badgePulse 2.4s ease-in-out infinite;
  }
  .funded-badge svg{width:10px;height:10px;}
  .card-meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:3px 0 6px; font-size:11px; color:var(--ink-soft);}
  .meta-item{display:flex; align-items:center; gap:3px;}
  .meta-item svg{width:12.5px; height:12.5px;}
  .person-pill{ font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:20px; color:#fff; }

  .emoji-picker{ display:flex; flex-wrap:wrap; gap:5px; background:var(--paper-dim); border:1.5px dashed var(--line); border-radius:10px; padding:8px; margin:2px 0 8px; max-height:150px; overflow-y:auto; }
  .emoji-option{ width:32px; height:32px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .emoji-option:active{ transform:scale(.9); }
  .emoji-option.selected{ border-color:var(--ink); background:var(--teal-wash); }
  .emoji-option.auto-option{ width:auto; padding:0 10px; font-size:10.5px; font-weight:600; color:var(--ink-soft); }

  .progress-wrap{margin-bottom:2px;}
  .progress-label{ display:flex; justify-content:space-between; align-items:baseline; font-size:12px; margin-bottom:3px; }
  .progress-label .objectif-edit{ display:flex; align-items:center; gap:4px; color:var(--ink-soft); }
  .progress-label .objectif-edit input{
    width:64px; padding:2px 5px; font-size:12px; border:1.5px solid transparent; background:transparent;
    text-align:right; font-family:'Fraunces', serif; font-weight:600; color:var(--ink);
  }
  .progress-label .objectif-edit input:hover, .progress-label .objectif-edit input:focus{ border-color:var(--line); background:var(--surface); }
  .progress-bar-outer{ position:relative; height:21px; border-radius:20px; overflow:hidden; border:1.2px solid var(--line); background: linear-gradient(90deg, var(--gauge-start) 0%, var(--gauge-end) 100%); }
  .progress-bar-cover{ position:absolute; top:0; right:0; height:100%; background:var(--paper-dim); transition: width .35s ease; }
  .progress-bar-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .progress-bar-pct span{ background:var(--pill-bg); color:var(--ink); font-family:'Fraunces', serif; font-weight:600; font-size:10.5px; padding:1px 8px; border-radius:20px; }
  .monthly-hint{ font-size:10.5px; color:var(--ink-soft); margin:4px 0 6px; }
  .monthly-hint strong{ color:var(--ink); }

  .card-bottom{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px;}
  .amount-controls{display:flex; align-items:center; gap:6px;}
  .amount-controls input{width:88px; text-align:right; font-family:'Fraunces', serif; font-weight:600;}
  .step-btn{ width:26px; height:26px; border-radius:6px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-size:15px; line-height:1; color:var(--ink-soft); }
  .step-btn:hover{border-color:var(--ink); color:var(--ink);}
  .step-btn:active{ transform:scale(.9); }
  .card-actions{display:flex; gap:4px; align-items:center;}
  .icon-btn{ position:relative; width:28px; height:28px; border-radius:6px; border:none; background:transparent; cursor:pointer; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{background:var(--paper-dim); color:var(--ink);}
  .icon-btn.active{ background:var(--paper-dim); color:var(--ink); }
  .icon-btn:active{ transform:scale(.9); }
  .icon-btn svg{width:16px; height:16px;}
  .notes-badge{ position:absolute; top:-3px; right:-3px; background:var(--ochre); color:#fff; font-size:9px; font-weight:700; width:14px;height:14px;border-radius:50%; display:flex;align-items:center;justify-content:center; }
  .reorder-col{display:flex; flex-direction:column; gap:2px;}
  .reorder-col button{padding:0; width:22px; height:18px; font-size:11px;}
  .drag-handle{
    width:30px; height:34px; padding:0; border:none; background:transparent; cursor:grab;
    color:var(--ink-soft); opacity:.55; border-radius:7px; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  .drag-handle svg{ width:19px; height:19px; }
  .drag-handle:hover{ opacity:1; background:var(--paper-dim); }
  .drag-handle:active{ cursor:grabbing; }
  .card.dragging{
    position:relative; z-index:60; cursor:grabbing;
    box-shadow:0 10px 26px rgba(0,0,0,.35); transform-origin:center;
    /* sans cela, la carte suivrait le doigt avec le retard de la transition
       héritée de .card, et les permutations seraient calculées de travers */
    transition:none;
  }
  .card.dragging .drag-handle{ opacity:1; }
  .prio-section.reordering .card:not(.dragging){ transition: transform .18s ease; }

  .edit-panel{ margin-top:12px; padding-top:12px; border-top:1.5px dashed var(--line); }
  .notes-section{margin-top:10px;}
  .note-item{ background:var(--paper-dim); border:1.2px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
  .note-item-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .note-type-tag{ display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--ink-soft); }
  .note-type-tag svg{width:12px;height:12px;}
  .note-body{font-size:13px; word-break:break-word;}
  .note-body img{max-width:100%; border-radius:8px; display:block;}
  .note-body a{color:var(--ink); font-weight:600;}
  .add-note-form{ margin-top:8px; }

  .empty{ text-align:center; padding:34px 10px; color:var(--ink-soft); font-size:13.5px; }
  .empty .big{font-family:'Fraunces', serif; font-style:italic; font-size:17px; display:block; margin-bottom:4px; color:var(--ink);}

  .vg-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:9px; padding:9px 12px; margin-bottom:9px; }
  .vg-item.done{opacity:0.55;}
  .vg-item.done .vg-name{text-decoration:line-through;}
  .vg-check{ width:20px; height:20px; border-radius:5px; border:1.8px solid var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; background:var(--surface); transition: background .15s ease, border-color .15s ease; }
  .vg-check.checked{ background:var(--teal); border-color:var(--teal); }
  .vg-check svg{width:13px;height:13px;color:#fff;}
  .vg-name{flex:1; font-size:14.5px;}

  /* Idea cards */

  .idea-card{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--ink); border-left-width:6px; border-radius:10px; padding:9px 12px; transition: box-shadow .2s ease, transform .2s ease; }
  @media (hover:hover){ .idea-card:hover{ box-shadow:3px 3px 0 var(--card-shadow); transform:translateY(-1px);} }
  .idea-icon-btn{ width:40px;height:40px;border-radius:50%; background:var(--paper-dim); border:1.5px solid var(--line); display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; cursor:pointer; padding:0; transition: transform .12s ease; }
  .idea-icon-btn:active{ transform:scale(.92); }
  .idea-card-wrap{ display:flex; flex-direction:column; margin-bottom:9px; }
  .idea-body{flex:1; min-width:0;}
  .idea-name{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .category-tag{ display:inline-block; margin-top:3px; font-size:11px; padding:2px 8px; border-radius:20px; border:1.2px solid var(--line); color:var(--ink-soft); }

  /* Activity cards */
  .activity-card-wrap{ margin-bottom:9px; }
  .activity-card{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; }
  .activity-card.done{ opacity:.6; }
  .activity-card.done .activity-name{ text-decoration:line-through; }
  .activity-check{ width:22px;height:22px;border-radius:6px;border:1.8px solid var(--ink-soft); display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; background:var(--surface); transition: background .15s ease, border-color .15s ease; }
  .activity-check.checked{ background:var(--teal); border-color:var(--teal); }
  .activity-check svg{width:13px;height:13px;color:#fff;}
  .activity-icon-btn{ width:40px;height:40px;border-radius:50%; background:var(--paper-dim); border:1.5px solid var(--line); display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; cursor:pointer; padding:0; transition: transform .12s ease; }
  .activity-icon-btn:active{ transform:scale(.92); }
  .activity-body{flex:1; min-width:0;}
  .activity-name{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
  .activity-meta{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .activity-meta svg{width:13px;height:13px;}

// --- Protection de la saisie en cours -----------------------------------
// Un rendu complet remplace le contenu de la page : sans précaution, tout texte
// tapé mais pas encore enregistré serait perdu (changement de pastille, ou
// modification faite par l'autre personne pendant qu'on écrit).
// On photographie donc les champs de saisie avant le rendu, et on les restaure
// après, curseur compris. Seuls les champs marqués data-keep sont concernés :
// les champs pilotés par les données (montants, objectifs) doivent bien se
// rafraîchir depuis l'état.
function photographierSaisies(){
  const saisies = { valeurs:{}, actif:null, debut:0, fin:0 };
  document.querySelectorAll('#page [data-keep]').forEach(el=>{
    saisies.valeurs[el.dataset.keep] = el.value;
  });
  const actif = document.activeElement;
  if(actif && actif.dataset && actif.dataset.keep){
    saisies.actif = actif.dataset.keep;
    try{ saisies.debut = actif.selectionStart; saisies.fin = actif.selectionEnd; }catch(e){}
  }
  return saisies;
}
function restaurerSaisies(saisies){
  document.querySelectorAll('#page [data-keep]').forEach(el=>{
    const v = saisies.valeurs[el.dataset.keep];
    if(v !== undefined && v !== '') el.value = v;
    if(saisies.actif && el.dataset.keep === saisies.actif){
      el.focus();
      try{ el.setSelectionRange(saisies.debut, saisies.fin); }catch(e){}
    }
  });
}
// Sélection d'une pastille sans reconstruire la page (évite toute perte de saisie)
function activerPastille(chip){
  const rangee = chip.parentElement;
  if(!rangee) return;
  rangee.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  chip.classList.add('selected');
}

function moisRestants(echeanceStr){
  if(!echeanceStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(echeanceStr + 'T00:00:00');
  if(isNaN(target.getTime())) return null;
  if(target <= today) return 0;
  let months = (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth());
  if(target.getDate() < today.getDate()) months -= 1;
  return Math.max(0, months);
}
function formatMonthlyHint(objectif, echeanceStr){
  if(!objectif || objectif <= 0) return "Indiquez un objectif pour estimer l'effort mensuel.";
  const months = moisRestants(echeanceStr);
  if(months === null) return "Ajoutez une échéance pour savoir combien épargner chaque mois.";
  if(months === 0) return `Échéance proche : il faudra réunir ${euros(objectif)} rapidement.`;
  const mensuel = Math.ceil(objectif / months);
  return `Soit environ <strong>${euros(mensuel)}/mois</strong> pendant ${months} mois.`;
}
function cardMonthlyHint(p){
  const objectif = Number(p.objectif) || 0, epargne = Number(p.epargne) || 0, remaining = objectif - epargne;
  if(objectif <= 0 || remaining <= 0 || !p.echeance) return '';
  const months = moisRestants(p.echeance);
  if(months === null) return '';
  if(months === 0) return `<div class="monthly-hint">Échéance dans moins d'un mois, reste <strong>${euros(remaining)}</strong> à réunir</div>`;
  const mensuel = Math.ceil(remaining / months);
  return `<div class="monthly-hint">Encore <strong>${euros(remaining)}</strong> à épargner, soit <strong>${euros(mensuel)}/mois</strong></div>`;
}

function migrateState(){
  if(!state.projets) state.projets = [];

  if(!state.idees) state.idees = [];
  if(!state.activites) state.activites = [];
  if(!state.courses) state.courses = [];
  if(!state.coursesFrequentes) state.coursesFrequentes = {};
  state.projets.forEach(p=>{
    if(p.objectif === undefined){ p.objectif = Number(p.montant) || 0; p.epargne = Number(p.montant) || 0; delete p.montant; }
    if(p.epargne === undefined) p.epargne = 0;
    if(!p.priorite || !PRIORITIES.includes(p.priorite)) p.priorite = 'Peut-être';
    if(!p.notes) p.notes = [];
    if(p.termine === undefined) p.termine = false;
  });
}

// --- Échéances ---------------------------------------------------------
function joursRestants(echeanceStr){
  if(!echeanceStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(echeanceStr + 'T00:00:00');
  if(isNaN(target.getTime())) return null;
  return Math.round((target - today) / 86400000);
}
function echeanceBadge(p){
  if(p.termine) return '';
  const objectif = Number(p.objectif)||0, epargne = Number(p.epargne)||0;
  if(objectif > 0 && epargne >= objectif) return '';   // déjà financé, pas d'alerte
  const j = joursRestants(p.echeance);
  if(j === null) return '';
  if(j < 0) return `<span class="deadline-badge late">En retard</span>`;
  if(j === 0) return `<span class="deadline-badge late">Aujourd'hui</span>`;
  if(j <= 45) return `<span class="deadline-badge soon">J-${j}</span>`;
  return '';
}

const CONFETTI_COLORS = ['#C98A2C','#3F7A6C','#4C86D9','#C97B87','#D9A441','#8E76AC'];
function celebrer(){
  const layer = document.getElementById('confetti-layer');
  if(!layer) return;
  for(let i=0;i<38;i++){
    const bit = document.createElement('div');
    bit.className = 'confetti-bit';
    bit.style.left = Math.random()*100 + 'vw';
    bit.style.top = '-20px';
    bit.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    bit.style.animationDelay = (Math.random()*0.35) + 's';
    bit.style.transform = `rotate(${Math.random()*360}deg)`;
    layer.appendChild(bit);
    setTimeout(()=>bit.remove(), 2600);
  }
}
function estFinance(p){
  const o = Number(p.objectif)||0, e = Number(p.epargne)||0;
  return o > 0 && e >= o;
}
// Applique un changement de montant et fête l'événement si l'objectif vient d'être atteint.
function majEpargne(p, nouvelleValeur){
  const avant = estFinance(p);
  p.epargne = Math.max(0, nouvelleValeur);
  if(!avant && estFinance(p)) celebrer();
  commit();
}

// --- Suppression avec confirmation -------------------------------------
function cleSuppression(kind, id, parentId){
  return [kind, parentId, id].filter(Boolean).join(':');
}
function boutonSuppression(kind, id, parentId){
  const cle = cleSuppression(kind, id, parentId);
  if(ui.pendingDelete === cle){
    return `<button class="confirm-del" data-del-key="${cle}">Confirmer ?</button>`;
  }
  return `<button class="icon-btn ask-del" data-del-key="${cle}" title="Supprimer">${ICON_TRASH}</button>`;
}
function executerSuppression(cle){
  const parts = cle.split(':');
  const kind = parts[0];
  if(kind === 'projet') state.projets = state.projets.filter(x=>x.id!==parts[1]);
  else if(kind === 'vg') state.videGrenier = state.videGrenier.filter(x=>x.id!==parts[1]);
  else if(kind === 'idee') state.idees = state.idees.filter(x=>x.id!==parts[1]);
  else if(kind === 'activite') state.activites = state.activites.filter(x=>x.id!==parts[1]);
  else if(kind === 'course') state.courses = state.courses.filter(x=>x.id!==parts[1]);
  else if(kind === 'note'){
    const proj = state.projets.find(x=>x.id===parts[1]);
    if(proj) proj.notes = (proj.notes||[]).filter(n=>n.id!==parts[2]);
  }
  ui.pendingDelete = null;
  commit();
}

function ilYA(ts){
  if(!ts) return '';
  const sec = Math.floor((Date.now() - ts)/1000);
  if(sec < 60) return "à l'instant";
  const min = Math.floor(sec/60);
  if(min < 60) return `il y a ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `il y a ${h} h`;
  const j = Math.floor(h/24);
  if(j === 1) return 'hier';
  return `il y a ${j} jours`;
}
function telechargerSauvegarde(){

  a.download = `carnet-projets-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

let firstSnapshot = true;

function subscribeState(){
  buildTabs();
  initTheme();
  initWhoami();
  setSyncStatus('connexion…');
  onSnapshot(docRef, { includeMetadataChanges: true }, (snap)=>{
    // On ignore l'écho local de nos propres écritures pas encore confirmées,
    // pour éviter de redessiner l'écran pendant qu'on est en train de taper.
    if(snap.metadata.hasPendingWrites && !firstSnapshot) return;

    if(snap.exists()){
      state = snap.data().state || state;
    } else if(firstSnapshot) {
      // Tout premier lancement : personne n'a encore de données, on les crée.
      setDoc(docRef, { state, updatedAt: Date.now() });
    }
    migrateState();
    firstSnapshot = false;
    setSyncStatus(snap.metadata.fromCache ? 'hors ligne' : '');
    renderAll();
  }, (err)=>{
    console.error('Erreur de synchronisation Firestore', err);
    setSyncStatus('erreur de connexion');
  });
}

async function saveState(){
  try{
    state.dernierAuteur = moi || '';
    state.dernierChangement = Date.now();
    await setDoc(docRef, { state, updatedAt: Date.now() });
  }catch(e){
    console.error('Sauvegarde impossible', e);
    setSyncStatus('non sauvegardé ⚠️');
  }
}
function commit(){ saveState(); renderAll(); }

function appliquerTheme(id){
  document.documentElement.dataset.theme = id;
  localStorage.setItem('carnet-theme', id);
  const t = THEMES.find(x=>x.id===id) || THEMES[0];
  const btn = document.getElementById('themeBtn');

function initTheme(){
  appliquerTheme(localStorage.getItem('carnet-theme') || 'auto');
  const btn = document.getElementById('themeBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const actuel = document.documentElement.dataset.theme || 'auto';

    appliquerTheme(suivant);

  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if((document.documentElement.dataset.theme || 'auto') === 'auto'){
      appliquerTheme('auto'); renderAll();

function totals(){
  // Les projets terminés ne mobilisent plus d'argent : la dépense est déjà sortie de la réserve.
  const attribue = state.projets.filter(p=>!p.termine).reduce((s,p)=>s+(Number(p.epargne)||0),0);
  const libre = state.reserveTotal - state.reserveSecurite - attribue;
  return { attribue, libre };
}

function renderAll(){
  const t = totals();
  const freeEl = document.getElementById('statFree');
  const freeValueEl = freeEl.querySelector('.value');
  const nouvelleValeur = euros(t.libre);
  if(freeValueEl.textContent !== '—' && freeValueEl.textContent !== nouvelleValeur){
    freeValueEl.classList.remove('bump');
    void freeValueEl.offsetWidth;      // force le redémarrage de l'animation
    freeValueEl.classList.add('bump');
  }
  freeEl.classList.toggle('negative', t.libre < 0);
  freeValueEl.textContent = nouvelleValeur;
  freeEl.querySelector('.label').innerHTML = ICON_COIN + 'Non attribué';
  document.getElementById('statSafe').textContent = euros(state.reserveSecurite);
  document.querySelector('.stat.safe .label').innerHTML = ICON_SHIELD + 'Gardé en sécurité';

  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === ui.activeTab));

  const authorEl = document.getElementById('authorNote');
  if(authorEl){
    if(state.dernierChangement){
      const qui = state.dernierAuteur ? `par ${state.dernierAuteur} ` : '';
      authorEl.textContent = `Dernière modification ${qui}${ilYA(state.dernierChangement)}`;
    } else authorEl.textContent = '';
  }

  const page = document.getElementById('page');
  const saisiesEnCours = photographierSaisies();
  if(ui.activeTab === 'reserves') page.innerHTML = renderReserves();
  else if(ui.activeTab === 'projets') page.innerHTML = renderProjets();
  else if(ui.activeTab === 'courses') page.innerHTML = renderCourses();
  else if(ui.activeTab === 'ideesMarion') page.innerHTML = renderIdees('Marion');
  else if(ui.activeTab === 'ideesNil') page.innerHTML = renderIdees('Nil');
  else if(ui.activeTab === 'activites') page.innerHTML = renderActivites();
  else page.innerHTML = renderVideGrenier();

  // L'animation d'entrée ne joue qu'au changement d'onglet : pendant l'édition,
  // la page se met à jour sans rejouer l'animation à chaque frappe.
  if(ui.animateTab && page.firstElementChild){
    page.firstElementChild.classList.add('panel-anim');
    ui.animateTab = false;
  }

  restaurerSaisies(saisiesEnCours);
  attachPageEvents();
}

function renderReserves(){
  const t = totals();
  const total = Math.max(state.reserveTotal, state.reserveSecurite + t.attribue, 1);
  const pctSafe = Math.min(100, (state.reserveSecurite/total)*100);
  const pctAttr = Math.min(100 - pctSafe, (t.attribue/total)*100);
  const pctFree = Math.max(0, 100 - pctSafe - pctAttr);
  let warn = '';
  if(t.libre < 0) warn = `<div class="warn">Vous avez épargné ${euros(Math.abs(t.libre))} de plus que ce que vous avez en réserve.</div>`;

  return `<div class="tab-panel">
    <h2 class="section-title">Combien avez-vous de côté ?</h2>
    <p class="subtext">Indiquez le total mis de côté, et la part que vous voulez garder en sécurité, à l'abri de tout projet.</p>
    <div class="row2">
      <div class="field"><label for="inpTotal">Total en réserve</label><input type="number" id="inpTotal" min="0" step="10" value="${state.reserveTotal}"></div>
      <div class="field"><label for="inpSecu">À garder en sécurité</label><input type="number" id="inpSecu" min="0" step="10" value="${state.reserveSecurite}"></div>
    </div>
    <div class="bar-outer">
      <div class="bar-seg" style="width:${pctSafe}%; background:var(--ink-soft);"></div>
      <div class="bar-seg" style="width:${pctAttr}%; background:var(--ochre);"></div>
      <div class="bar-seg" style="width:${pctFree}%; background:var(--teal);"></div>
    </div>
    <div class="bar-legend">
      <span><i class="dot" style="background:var(--ink-soft);"></i>Sécurité : ${euros(state.reserveSecurite)}</span>
      <span><i class="dot" style="background:var(--ochre);"></i>Épargné sur les projets : ${euros(t.attribue)}</span>
      <span><i class="dot" style="background:var(--teal);"></i>Non attribué : ${euros(t.libre)}</span>
    </div>
    ${warn}
    <div style="border-top:1.5px dashed var(--line); margin-top:6px; padding-top:14px;">
      <p class="subtext" style="margin-bottom:8px;">Une copie de tout le carnet, à garder sur votre ordinateur au cas où.</p>
      <button class="primary" id="btnExport" style="background:transparent; color:var(--ink); border:1.5px solid var(--line);">⬇ Télécharger une sauvegarde</button>
    </div>
  </div>`;
}

    body = `<a href="${escapeHtml(n.content)}" target="_blank" rel="noopener noreferrer">${escapeHtml(n.content)}</a>`;

}

function renderProjets(){
  const t = totals();
  const actifs = state.projets.filter(p=>!p.termine);
  const termines = state.projets.filter(p=>p.termine);

  // Vue d'ensemble : où en est l'ensemble des projets en cours ?
  const totalObjectif = actifs.reduce((s,p)=>s+(Number(p.objectif)||0),0);
  const totalEpargne = actifs.reduce((s,p)=>s+(Number(p.epargne)||0),0);
  const pctGlobal = totalObjectif > 0 ? Math.min(100, (totalEpargne/totalObjectif)*100) : 0;
  const nbFinances = actifs.filter(estFinance).length;
  const resteAFinancer = Math.max(0, totalObjectif - totalEpargne);

  const overview = actifs.length ? `
    <div class="overview">
      <div class="overview-top">
        <span class="overview-title">Avancement global</span>
        <span class="overview-amounts">${euros(totalEpargne)} <small>/ ${euros(totalObjectif)}</small></span>
      </div>
      <div class="overview-bar"><div class="overview-fill" style="width:${pctGlobal}%"></div></div>
      <div class="overview-stats">
        <span><b>${Math.round(pctGlobal)}%</b> atteint</span>
        <span><b>${nbFinances}</b> financé${nbFinances>1?'s':''} sur ${actifs.length}</span>
        <span>Reste <b>${euros(resteAFinancer)}</b></span>
      </div>
    </div>` : '';

  // Recherche et filtre par personne
  const q = ui.projetSearch.trim().toLowerCase();
  const visibles = actifs.filter(p=>{
    const okPersonne = !ui.projetFiltrePersonne || p.personne === ui.projetFiltrePersonne;
    const okTexte = !q || p.nom.toLowerCase().includes(q) || (p.type||'').toLowerCase().includes(q);
    return okPersonne && okTexte;
  });

  const barreOutils = actifs.length > 2 ? `
    <div class="toolbar">
      <input type="text" id="projetSearch" placeholder="Rechercher un projet…" value="${escapeHtml(ui.projetSearch)}">
    </div>
    <div class="filter-row">
      <button class="filter-chip tous ${!ui.projetFiltrePersonne?'on':''}" data-filtre="">Tous</button>
      ${PERSONS.map(per=>`<button class="filter-chip ${ui.projetFiltrePersonne===per?'on':''}" data-filtre="${per}" ${ui.projetFiltrePersonne===per?`style="background:${PERSON_COLORS[per]}"`:''}>${per}</button>`).join('')}
    </div>` : '';

  let body = '';
  if(state.projets.length === 0){
    body = `<div class="empty"><span class="big">Pas encore de projet.</span>Ajoutez le premier ci-dessus.</div>`;
  } else if(visibles.length === 0 && actifs.length > 0){
    body = `<div class="empty"><span class="big">Aucun projet ne correspond.</span>Essayez un autre mot ou retirez le filtre.</div>`;
  } else {
    body = PRIORITIES.map(prio=>{
      const groupItems = visibles.filter(p=>p.priorite===prio);
      if(groupItems.length === 0) return '';
      const groupIds = groupItems.map(p=>p.id);
      const style = PRIORITY_STYLES[prio];
      const epargneGroupe = groupItems.reduce((s,p)=>s+(Number(p.epargne)||0),0);
      const cards = groupItems.map(p=>renderProjetCard(p, groupIds)).join('');
      return `<div class="prio-section">
          <div class="prio-header" style="background:${style.bg}; color:${style.text}">
            <span class="prio-name">${prio}</span><span class="prio-count">${groupItems.length} · ${euros(epargneGroupe)} épargnés</span>
          </div>${cards}
        </div>`;
    }).join('');
  }

  // Projets réalisés, repliés par défaut pour ne pas encombrer la liste
  const archive = termines.length ? `
    <div class="archive-header" id="toggleArchive">
      <span>✓ Projets réalisés (${termines.length})</span>
      <span>${ui.showArchive ? '▲' : '▼'}</span>
    </div>
    ${ui.showArchive ? termines.map(p=>renderProjetCard(p, termines.map(x=>x.id))).join('') : ''}` : '';

  return `<div class="tab-panel">
    <div class="add-toggle">
      <div><h2 class="section-title" style="margin-bottom:2px;">Vos projets</h2><p class="subtext" style="margin-bottom:0;">${actifs.length} en cours · ${euros(t.attribue)} épargnés</p></div>
      <button class="primary" id="btnToggleAddProjet">${ui.showAddProjet ? 'Fermer' : '+ Ajouter'}</button>
    </div>
    ${ui.showAddProjet ? renderAddProjetForm() : ''}
    ${overview}
    ${barreOutils}
    ${body}
    ${archive}
  </div>`;
}

function renderIdees(personne){
  const list = state.idees.filter(i=>i.personne===personne);
  const styles = (sombreActif() ? IDEA_STYLES_SOMBRE : IDEA_PRIORITY_STYLES)[personne];
  const accent = PERSON_COLORS[personne];
  const categories = [...new Set(list.map(i=>i.categorie).filter(Boolean))].sort();

  let body = '';
  if(list.length===0){
    body = `<div class="empty"><span class="big">Pas encore d'idée pour ${personne}.</span>Ajoutez-en une ci-dessus.</div>`;
  } else if(ui.ideeGroupBy === 'categorie'){
    // Regroupement par catégorie personnalisée
    const groupes = [...categories, null];
    body = groupes.map(cat=>{
      const items = list.filter(i=> cat ? i.categorie===cat : !i.categorie);
      if(items.length===0) return '';
      const titre = cat || 'Sans catégorie';
      const cards = items.map((i,ix)=>renderIdeeCard(i, accent, categories, ix)).join('');
      return `<div class="prio-section"><div class="prio-header" style="background:${accent};color:#fff"><span class="prio-name">${escapeHtml(titre)}</span><span class="prio-count">${items.length}</span></div>${cards}</div>`;
    }).join('');
  } else {
    body = SIMPLE_PRIORITIES.map(prio=>{
      const items = list.filter(i=>i.priorite===prio);
      if(items.length===0) return '';
      const st = styles[prio];
      const cards = items.map((i,ix)=>renderIdeeCard(i, accent, categories, ix)).join('');
      return `<div class="prio-section"><div class="prio-header" style="background:${st.bg};color:${st.text}"><span class="prio-name">${prio}</span><span class="prio-count">${items.length}</span></div>${cards}</div>`;

// Mémorise ce qu'on achète souvent, pour le reproposer en un geste la fois suivante
function memoriserArticle(nom, section){
  const cle = section + ':' + nom.toLowerCase();
  const e = state.coursesFrequentes[cle] || { nom, section, n: 0 };
  e.nom = nom; e.section = section; e.n = (e.n || 0) + 1;
  state.coursesFrequentes[cle] = e;
}
// Suggestions : les plus repris, en excluant ce qui est déjà sur la liste
function articlesSuggeres(limite){
  const dejaLa = new Set(state.courses.map(c=>c.section + ':' + c.nom.toLowerCase()));
  return Object.entries(state.coursesFrequentes)
    .filter(([cle, e]) => e.n >= 2 && !dejaLa.has(cle))
    .sort((a,b)=> b[1].n - a[1].n)
    .slice(0, limite)
    .map(([cle, e]) => ({ cle, ...e }));
}

// --- Partage de la liste de courses -------------------------------------
function texteListeCourses(){
  const lignes = ['Liste de courses'];
  COURSE_SECTIONS.forEach(sec=>{
    const items = state.courses.filter(c=>c.section===sec.id && !c.pris);
    if(!items.length) return;
    lignes.push('', `${sec.emoji} ${sec.id}`);
    items.forEach(c=> lignes.push(`- ${c.nom}${c.qte ? ` (${c.qte})` : ''}`));
  });
  if(lignes.length === 1) lignes.push('', '(rien à prendre)');
  return lignes.join('\n');
}

function messageFugitif(txt){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = txt;
  el.classList.add('visible');
  clearTimeout(messageFugitif._t);
  messageFugitif._t = setTimeout(()=> el.classList.remove('visible'), 2600);
}

async function partagerCourses(){
  const texte = texteListeCourses();
  // Sur téléphone, on ouvre le partage natif (Messages, WhatsApp, mail...)
  if(navigator.share){
    try{
      await navigator.share({ title: 'Liste de courses', text: texte });
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;   // partage annulé, rien à signaler
    }
  }
  try{
    await navigator.clipboard.writeText(texte);
    messageFugitif('Liste copiée, prête à être collée');
  }catch(e){
    messageFugitif('Copie impossible sur ce navigateur');
  }
}

// --- Réorganisation par glisser-déposer ---------------------------------
// La carte saisie suit le doigt ; les voisines s'écartent pour ouvrir la place.
// La position visée est calculée à partir de la distance parcourue plutôt que
// mesurée sur la page : c'est exact quelle que soit la vitesse du geste.
let glisse = null;

function cartesVoisines(card){
  return Array.from(card.parentElement.querySelectorAll(':scope > .card'));
}

function appliquerOrdre(section, ids){
  // On réécrit uniquement les emplacements occupés par ce groupe :
  // les projets des autres priorités ne bougent pas.
  const emplacements = [];
  state.projets.forEach((p,i)=>{ if(ids.includes(p.id)) emplacements.push(i); });
  const objets = ids.map(id => state.projets.find(p=>p.id===id)).filter(Boolean);
  if(objets.length !== emplacements.length) return;
  emplacements.forEach((pos,k)=> state.projets[pos] = objets[k]);
  commit();
}

function demarrerGlisse(handle, e){
  const card = handle.closest('.card');
  const section = card.parentElement;
  const cartes = cartesVoisines(card);
  if(cartes.length < 2) return;                    // rien à réordonner

  // Hauteur d'un emplacement, mesurée avant tout déplacement
  const pas = Math.abs(cartes[1].offsetTop - cartes[0].offsetTop) || card.offsetHeight;

  glisse = {
    card, section, cartes, pas,
    depart: cartes.indexOf(card),
    cible: cartes.indexOf(card),
    originY: e.clientY, bouge: false
  };
  card.classList.add('dragging');
  section.classList.add('reordering');
  document.body.style.userSelect = 'none';
  // Écouteurs posés sur le document : déplacer une carte dans la page
  // relâcherait la capture du pointeur, et le relâchement du doigt serait perdu.
  document.addEventListener('pointermove', pendantGlisse);
  document.addEventListener('pointerup', finirGlisse);
  document.addEventListener('pointercancel', finirGlisse);
}

function pendantGlisse(e){
  if(!glisse) return;
  const { card, cartes, pas, depart } = glisse;
  const dy = e.clientY - glisse.originY;
  if(Math.abs(dy) > 3) glisse.bouge = true;
  card.style.transform = `translateY(${dy}px)`;

  // Un demi-emplacement parcouru fait basculer d'un rang
  const cible = Math.max(0, Math.min(cartes.length - 1, depart + Math.round(dy / pas)));
  if(cible !== glisse.cible){
    glisse.cible = cible;
    // Les cartes situées entre le départ et la cible s'écartent d'un cran
    cartes.forEach((c, i)=>{
      if(c === card) return;
      let decalage = 0;
      if(cible > depart && i > depart && i <= cible) decalage = -pas;
      else if(cible < depart && i >= cible && i < depart) decalage = pas;
      c.style.transform = decalage ? `translateY(${decalage}px)` : '';
    });
  }

  // défilement automatique près des bords de l'écran
  const marge = 90;
  if(e.clientY < marge) window.scrollBy(0, -12);
  else if(e.clientY > window.innerHeight - marge) window.scrollBy(0, 12);
}

function finirGlisse(){
  if(!glisse) return;
  const { card, section, cartes, depart, cible, bouge } = glisse;
  document.removeEventListener('pointermove', pendantGlisse);
  document.removeEventListener('pointerup', finirGlisse);
  document.removeEventListener('pointercancel', finirGlisse);
  cartes.forEach(c=> c.style.transform = '');
  card.classList.remove('dragging');
  section.classList.remove('reordering');
  document.body.style.userSelect = '';
  glisse = null;

  if(bouge && cible !== depart){
    const ids = cartes.map(c=>c.dataset.id);
    const [deplace] = ids.splice(depart, 1);
    ids.splice(cible, 0, deplace);
    appliquerOrdre(section, ids);
  }
}

function moveWithinPriority(id, direction){
  const proj = state.projets.find(p=>p.id===id);
  if(!proj) return;
  // On ne réorganise qu'entre projets du même statut (en cours / réalisés)
  // et de même priorité, pour que les flèches correspondent à ce qui est affiché.
  const groupIds = state.projets
    .filter(p=>p.priorite===proj.priorite && !!p.termine === !!proj.termine)
    .map(p=>p.id);
  const posInGroup = groupIds.indexOf(id);
  const targetPos = posInGroup + direction;
  if(targetPos < 0 || targetPos >= groupIds.length) return;
  const neighborId = groupIds[targetPos];
  const i1 = state.projets.findIndex(p=>p.id===id);
  const i2 = state.projets.findIndex(p=>p.id===neighborId);
  [state.projets[i1], state.projets[i2]] = [state.projets[i2], state.projets[i1]];
  commit();
}

function attachPageEvents(){
  // Suppression en deux temps : premier clic = demande, second = confirmation
  document.querySelectorAll('.ask-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{ ui.pendingDelete = btn.dataset.delKey; renderAll(); });
  });
  document.querySelectorAll('.confirm-del').forEach(btn=>{
    btn.addEventListener('click', ()=> executerSuppression(btn.dataset.delKey));
  });

  // Sélecteur de pictogramme (projets, idées, activités)
  document.querySelectorAll('.pic-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.kind + ':' + btn.dataset.id;
      if(ui.emojiPickerOpen.has(key)) ui.emojiPickerOpen.delete(key); else ui.emojiPickerOpen.add(key);
      renderAll();
    });
  });
  document.querySelectorAll('.emoji-option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const picker = btn.closest('.emoji-picker');
      const kind = picker.dataset.kind, id = picker.dataset.id, emoji = btn.dataset.emoji;
      let item;
      if(kind==='projet') item = state.projets.find(x=>x.id===id);
      else if(kind==='idee') item = state.idees.find(x=>x.id===id);
      else if(kind==='activite') item = state.activites.find(x=>x.id===id);
      if(item){ if(emoji){ item.emoji = emoji; } else { delete item.emoji; } }
      ui.emojiPickerOpen.delete(kind + ':' + id);
      commit();
    });
  });

  const inpTotal = document.getElementById('inpTotal');
  const inpSecu = document.getElementById('inpSecu');
  if(inpTotal) inpTotal.addEventListener('change', e=>{ state.reserveTotal = Number(e.target.value)||0; commit(); });
  if(inpSecu) inpSecu.addEventListener('change', e=>{ state.reserveSecurite = Number(e.target.value)||0; commit(); });
  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', telechargerSauvegarde);

  // Recherche et filtres de projets
  const searchEl = document.getElementById('projetSearch');
  if(searchEl) searchEl.addEventListener('input', e=>{
    ui.projetSearch = e.target.value; ui.focusSearch = true; renderAll();
  });
  document.querySelectorAll('[data-filtre]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ ui.projetFiltrePersonne = btn.dataset.filtre; renderAll(); });
  });
  const toggleArchive = document.getElementById('toggleArchive');
  if(toggleArchive) toggleArchive.addEventListener('click', ()=>{ ui.showArchive = !ui.showArchive; renderAll(); });

  // Projets : ajout
  const btnToggleAddProjet = document.getElementById('btnToggleAddProjet');
  if(btnToggleAddProjet) btnToggleAddProjet.addEventListener('click', ()=>{ ui.showAddProjet = !ui.showAddProjet; renderAll(); });
  document.querySelectorAll('#npPersonneRow .chip').forEach(chip=> chip.addEventListener('click', ()=>{ ui.newProjetPersonne = chip.dataset.person; activerPastille(chip); }));
  document.querySelectorAll('#npTypeRow .chip').forEach(chip=> chip.addEventListener('click', ()=>{ ui.newProjetType = chip.dataset.type; activerPastille(chip); }));
  document.querySelectorAll('#npPrioRow .chip').forEach(chip=> chip.addEventListener('click', ()=>{ ui.newProjetPriorite = chip.dataset.prio; activerPastille(chip); }));
  const npObjectifEl = document.getElementById('npObjectif');
  const npEcheanceEl = document.getElementById('npEcheance');
  function refreshHint(){
    const hintEl = document.getElementById('npMonthlyHint');
    if(!hintEl) return;
    hintEl.innerHTML = formatMonthlyHint(Number(npObjectifEl.value)||0, npEcheanceEl.value);
  }
  if(npObjectifEl) npObjectifEl.addEventListener('input', refreshHint);
  if(npEcheanceEl) npEcheanceEl.addEventListener('input', refreshHint);
  const btnSaveProjet = document.getElementById('btnSaveProjet');
  if(btnSaveProjet) btnSaveProjet.addEventListener('click', ()=>{
    const nom = document.getElementById('npNom').value.trim();
    if(!nom) return;
    const echeance = document.getElementById('npEcheance').value;
    const objectif = Math.max(0, Number(document.getElementById('npObjectif').value) || 0);
    state.projets.push({ id: uid(), nom, personne: ui.newProjetPersonne, type: ui.newProjetType,
      priorite: ui.newProjetPriorite, echeance, objectif, epargne: 0, notes: [] });
    ui.showAddProjet = false;
    commit();
  });

  // Projets : cartes
  document.querySelectorAll('.card').forEach(card=>{
    const id = card.dataset.id;
    const idx = state.projets.findIndex(p=>p.id===id);
    const proj = state.projets[idx];

    const up = card.querySelector('.reorder-up'); const down = card.querySelector('.reorder-down');
    if(up) up.addEventListener('click', ()=> moveWithinPriority(id, -1));
    if(down) down.addEventListener('click', ()=> moveWithinPriority(id, 1));

    const handle = card.querySelector('.drag-handle');
    if(handle){
      handle.addEventListener('pointerdown', e=>{ e.preventDefault(); demarrerGlisse(handle, e); });
      // au clavier, les flèches gardent le même rôle
      handle.addEventListener('keydown', e=>{
        if(e.key === 'ArrowUp'){ e.preventDefault(); ui.focusHandle = id; moveWithinPriority(id, -1); }
        else if(e.key === 'ArrowDown'){ e.preventDefault(); ui.focusHandle = id; moveWithinPriority(id, 1); }
      });
    }

    card.querySelector('.amt-minus').addEventListener('click', ()=>{ majEpargne(proj, (Number(proj.epargne)||0) - 10); });
    card.querySelector('.amt-plus').addEventListener('click', ()=>{ majEpargne(proj, (Number(proj.epargne)||0) + 10); });
    card.querySelector('.amt-input').addEventListener('change', e=>{ majEpargne(proj, Number(e.target.value)||0); });
    card.querySelector('.objectif-input').addEventListener('change', e=>{
      const avant = estFinance(proj);
      proj.objectif = Math.max(0, Number(e.target.value)||0);
      if(!avant && estFinance(proj)) celebrer();
      commit();
    });

    const btnTermine = card.querySelector('.toggle-termine');
    if(btnTermine) btnTermine.addEventListener('click', ()=>{
      // Un projet réalisé sort de la réserve : l'argent a été dépensé.
      // L'opération est réversible et laisse le "non attribué" inchangé.
      const montant = Number(proj.epargne) || 0;
      if(proj.termine){ proj.termine = false; state.reserveTotal += montant; }
      else { proj.termine = true; state.reserveTotal = Math.max(0, state.reserveTotal - montant); }
      commit();
    });

    const editBtn = card.querySelector('.edit-projet');
    if(editBtn) editBtn.addEventListener('click', ()=>{
      if(ui.expandedProjects.has(id)) ui.expandedProjects.delete(id); else ui.expandedProjects.add(id);
      renderAll();
    });

    const editPanel = card.querySelector('.edit-panel');
    if(editPanel){
      const editNom = editPanel.querySelector('.edit-nom');
      if(editNom) editNom.addEventListener('change', e=>{ const v=e.target.value.trim(); if(v) proj.nom = v; commit(); });
      editPanel.querySelectorAll('.edit-personne-row .chip').forEach(chip=> chip.addEventListener('click', ()=>{ proj.personne = chip.dataset.person; commit(); }));
      editPanel.querySelectorAll('.edit-type-row .chip').forEach(chip=> chip.addEventListener('click', ()=>{ proj.type = chip.dataset.type; commit(); }));
      editPanel.querySelectorAll('.edit-prio-row .chip').forEach(chip=> chip.addEventListener('click', ()=>{ proj.priorite = chip.dataset.prio; commit(); }));
      const editEcheance = editPanel.querySelector('.edit-echeance');
      if(editEcheance) editEcheance.addEventListener('change', e=>{ proj.echeance = e.target.value; commit(); });

      const addNoteForm = editPanel.querySelector('.add-note-form');
      if(addNoteForm){
        addNoteForm.querySelectorAll('.note-type-row .chip').forEach(chip=>{
          chip.addEventListener('click', ()=>{
            addNoteForm.querySelectorAll('.note-type-row .chip').forEach(c=>c.classList.remove('selected'));
            chip.classList.add('selected');
            const type = chip.dataset.notetype;
            addNoteForm.dataset.selectedType = type;
            const textArea = addNoteForm.querySelector('.note-input-text');
            const urlInput = addNoteForm.querySelector('.note-input-url');
            if(type==='Texte'){ textArea.style.display='block'; urlInput.style.display='none'; }
            else { textArea.style.display='none'; urlInput.style.display='block'; urlInput.placeholder = type==='Image' ? "https://... (lien de l'image)" : 'https://...'; }
          });
        });
        addNoteForm.querySelector('.add-note-btn').addEventListener('click', ()=>{
          const type = addNoteForm.dataset.selectedType || 'Texte';
          const content = type==='Texte' ? addNoteForm.querySelector('.note-input-text').value.trim() : addNoteForm.querySelector('.note-input-url').value.trim();
          if(!content) return;
          proj.notes = proj.notes || [];
          proj.notes.push({ id: uid(), type, content });
          commit();
        });
      }
    }
  });

  // Vide-grenier
  const btnToggleAddVG = document.getElementById('btnToggleAddVG');
  if(btnToggleAddVG) btnToggleAddVG.addEventListener('click', ()=>{ ui.showAddVG = !ui.showAddVG; renderAll(); });
  document.querySelectorAll('#vgPersonneRow .chip').forEach(chip=> chip.addEventListener('click', ()=>{ ui.newVGPersonne = chip.dataset.person; activerPastille(chip); }));
  const btnSaveVG = document.getElementById('btnSaveVG');
  if(btnSaveVG) btnSaveVG.addEventListener('click', ()=>{
    const nom = document.getElementById('vgNom').value.trim();
    if(!nom) return;
    state.videGrenier.push({ id: uid(), nom, personne: ui.newVGPersonne, trouve:false });
    ui.showAddVG = false;
    commit();
  });
  document.querySelectorAll('.vg-item').forEach(item=>{
    const id = item.dataset.id;
    const idx = state.videGrenier.findIndex(v=>v.id===id);
    item.querySelector('.vg-check').addEventListener('click', ()=>{ state.videGrenier[idx].trouve = !state.videGrenier[idx].trouve; commit(); });
  });

  // Idées
  const btnToggleAddIdee = document.getElementById('btnToggleAddIdee');
  if(btnToggleAddIdee) btnToggleAddIdee.addEventListener('click', ()=>{ ui.showAddIdee=!ui.showAddIdee; renderAll(); });
  document.querySelectorAll('#ideePrioRow .chip').forEach(chip=> chip.addEventListener('click', ()=>{ ui.newIdeePriorite=chip.dataset.prio; activerPastille(chip); }));
  document.querySelectorAll('[data-groupby]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ ui.ideeGroupBy = btn.dataset.groupby; renderAll(); });
  });
  const btnSaveIdee = document.getElementById('btnSaveIdee');
  if(btnSaveIdee) btnSaveIdee.addEventListener('click', ()=>{
    const nom = document.getElementById('ideeNom').value.trim();
    if(!nom) return;
    const categorie = document.getElementById('ideeCategorie').value.trim();
    const personne = btnSaveIdee.dataset.personne;
    state.idees.push({ id: uid(), personne, nom, categorie, priorite: ui.newIdeePriorite });
    ui.showAddIdee = false;
    commit();
  });
  document.querySelectorAll('.edit-idee').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      if(ui.expandedIdees.has(id)) ui.expandedIdees.delete(id); else ui.expandedIdees.add(id);
      renderAll();
    });
  });
  document.querySelectorAll('[data-edit-idee]').forEach(panel=>{
    const idee = state.idees.find(i=>i.id===panel.dataset.editIdee);
    if(!idee) return;
    panel.querySelector('.ei-nom').addEventListener('change', e=>{ const v=e.target.value.trim(); if(v){ idee.nom=v; commit(); } });
    panel.querySelector('.ei-categorie').addEventListener('change', e=>{ idee.categorie = e.target.value.trim(); commit(); });
    panel.querySelectorAll('.ei-prio-row .chip').forEach(chip=> chip.addEventListener('click', ()=>{ idee.priorite = chip.dataset.prio; commit(); }));
  });

  // Activités
  const btnToggleAddActivite = document.getElementById('btnToggleAddActivite');
  if(btnToggleAddActivite) btnToggleAddActivite.addEventListener('click', ()=>{ ui.showAddActivite=!ui.showAddActivite; renderAll(); });
  document.querySelectorAll('#actPrioRow .chip').forEach(chip=> chip.addEventListener('click', ()=>{ ui.newActivitePriorite=chip.dataset.prio; activerPastille(chip); }));
  const btnSaveActivite = document.getElementById('btnSaveActivite');
  if(btnSaveActivite) btnSaveActivite.addEventListener('click', ()=>{
    const nom = document.getElementById('actNom').value.trim();
    if(!nom) return;
    const lien = document.getElementById('actLien').value.trim();
    const emplacement = document.getElementById('actLieu').value.trim();
    const prix = Math.max(0, Number(document.getElementById('actPrix').value) || 0);
    state.activites.push({ id: uid(), nom, lien, emplacement, prix, priorite: ui.newActivitePriorite, fait:false });
    ui.showAddActivite = false;
    commit();
  });
  document.querySelectorAll('.activity-card').forEach(card=>{
    const id = card.dataset.id;
    const idx = state.activites.findIndex(a=>a.id===id);
    card.querySelector('.activity-check').addEventListener('click', ()=>{ state.activites[idx].fait = !state.activites[idx].fait; commit(); });
  });
  document.querySelectorAll('.edit-activite').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      if(ui.expandedActivites.has(id)) ui.expandedActivites.delete(id); else ui.expandedActivites.add(id);
      renderAll();
    });
  });
  document.querySelectorAll('[data-edit-activite]').forEach(panel=>{
    const act = state.activites.find(a=>a.id===panel.dataset.editActivite);
    if(!act) return;
    panel.querySelector('.ea-nom').addEventListener('change', e=>{ const v=e.target.value.trim(); if(v){ act.nom=v; commit(); } });
    panel.querySelector('.ea-lien').addEventListener('change', e=>{ act.lien = e.target.value.trim(); commit(); });
    panel.querySelector('.ea-lieu').addEventListener('change', e=>{ act.emplacement = e.target.value.trim(); commit(); });
    panel.querySelector('.ea-prix').addEventListener('change', e=>{ act.prix = Math.max(0, Number(e.target.value)||0); commit(); });
    panel.querySelectorAll('.ea-prio-row .chip').forEach(chip=> chip.addEventListener('click', ()=>{ act.priorite = chip.dataset.prio; commit(); }));
  });

  // Courses
  document.querySelectorAll('.course-sec-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ ui.courseSection = chip.dataset.sec; activerPastille(chip); document.getElementById('courseNom').focus(); });
  });
  const courseNom = document.getElementById('courseNom');
  const courseQte = document.getElementById('courseQte');
  function ajouterCourse(){
    const nom = courseNom.value.trim();
    if(!nom) return;
    state.courses.push({ id: uid(), nom, qte: courseQte.value.trim(), section: ui.courseSection, pris:false });
    memoriserArticle(nom, ui.courseSection);
    courseNom.value = ''; courseQte.value = '';
    ui.focusCourse = true;
    commit();
  }
  const btnAddCourse = document.getElementById('btnAddCourse');
  if(btnAddCourse) btnAddCourse.addEventListener('click', ajouterCourse);
  if(courseNom) courseNom.addEventListener('keydown', e=>{ if(e.key==='Enter') ajouterCourse(); });
  if(courseQte) courseQte.addEventListener('keydown', e=>{ if(e.key==='Enter') ajouterCourse(); });
  document.querySelectorAll('.course-item').forEach(item=>{
    const c = state.courses.find(x=>x.id===item.dataset.id);
    if(!c) return;
    item.querySelector('.course-check').addEventListener('click', ()=>{ c.pris = !c.pris; commit(); });
  });
  document.querySelectorAll('.suggestion-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const s = state.coursesFrequentes[chip.dataset.cle];
      if(!s) return;
      state.courses.push({ id: uid(), nom: s.nom, qte: '', section: s.section, pris:false });
      memoriserArticle(s.nom, s.section);
      commit();
    });
  });
  const btnPartager = document.getElementById('btnPartagerCourses');
  if(btnPartager) btnPartager.addEventListener('click', partagerCourses);

  const btnViderPris = document.getElementById('btnViderPris');
  if(btnViderPris) btnViderPris.addEventListener('click', ()=>{
    state.courses = state.courses.filter(c=>!c.pris);
    commit();
  });
  if(ui.focusCourse){
    const el = document.getElementById('courseNom');
    if(el) el.focus();
    ui.focusCourse = false;
  }

  if(ui.focusHandle){
    const h = document.querySelector(`.drag-handle[data-id="${ui.focusHandle}"]`);
    if(h) h.focus();
    ui.focusHandle = null;
  }

  // Garde le curseur dans la barre de recherche pendant la frappe
  if(ui.focusSearch){
    const s = document.getElementById('projetSearch');
    if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    ui.focusSearch = false;
  }
}

subscribeState();

// --- Fonctionnement hors ligne et mises à jour ---------------------------
// Le service worker garde une copie locale de l'application pour qu'elle
// démarre sans réseau. Quand une nouvelle version est publiée, on propose
// de recharger plutôt que de l'imposer au milieu d'une saisie.
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', async ()=>{
    try{
      const reg = await navigator.serviceWorker.register('sw.js');

      const proposerMiseAJour = (worker)=>{
        const banniere = document.getElementById('updateBar');
        if(!banniere) return;
        banniere.style.display = 'flex';
        banniere.querySelector('button').onclick = ()=>{
          worker.postMessage('ACTIVER_MAINTENANT');
        };
      };

      if(reg.waiting) proposerMiseAJour(reg.waiting);
      reg.addEventListener('updatefound', ()=>{
        const nouveau = reg.installing;
        if(!nouveau) return;
        nouveau.addEventListener('statechange', ()=>{
          // "installed" avec un contrôleur actif = une version plus récente attend
          if(nouveau.state === 'installed' && navigator.serviceWorker.controller){
            proposerMiseAJour(nouveau);
          }
        });
      });

      let rechargement = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if(rechargement) return;
        rechargement = true;
        location.reload();
      });
    }catch(e){
      console.warn('Service worker non enregistré', e);
    }
  });
}

// Indicateur de connexion : complète l'information venant de Firestore
function majEtatReseau(){
  if(!navigator.onLine) setSyncStatus('hors ligne');
  else if(document.getElementById('loadingTag').textContent === 'hors ligne') setSyncStatus('');
}
window.addEventListener('online', majEtatReseau);
window.addEventListener('offline', majEtatReseau);
majEtatReseau();
</script>
